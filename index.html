  } else {
    Object.keys(BOSSES).forEach(function (k) {
      var b = BOSSES[k];
      out.push({ name: b.name, desc: '专属技能：' + b.sig, color: b.color, stat: '生命 ' + b.hp + (k === 'oct' ? '+（随改装成长）' : '') + ' · ' + b.patterns.length + ' 种招式', own: true });
    });
  }
  return out;
}
var codexBossSel = 0;
function bossSkillName(p, def) {
  return (def.sigPat === p) ? def.sig : (PATTERN_NAMES[p] || p);
}
// 招式表格：金色 = 专属技，灰色 = 继承/通用招
function drawSkillGrid(x, y, w, def, perLine, size, maxY) {
  size = size || 11;
  var colW = w / perLine, rowH = size + 9;
  var cut = false;
  for (var i = 0; i < def.patterns.length; i++) {
    var p = def.patterns[i];
    var own = (p === def.sigPat) || !!OCT_OWN[p];
    var cx = x + (i % perLine) * colW;
    var cy = y + Math.floor(i / perLine) * rowH;
    if (maxY && cy + size > maxY) { cut = true; break; }   // 小窗口下超出可用高度就不再画
    txt((own ? '★ ' : '· ') + bossSkillName(p, def), cx, cy + size, size, own ? 'rgba(255,205,95,0.95)' : 'rgba(190,212,235,0.82)');
  }
  if (cut) txt('…', x + (i % perLine) * colW, y + Math.floor(i / perLine) * rowH + size, size, 'rgba(160,190,220,0.6)');
  return y + Math.ceil(def.patterns.length / perLine) * rowH;
}
function drawCodexBoss(px, py, pw, ph) {

    ctx.strokeStyle = sel ? bs.color : 'rgba(140,175,215,0.18)';

  }
  // 右侧：选中 BOSS 的详细信息 + 全部招式
  var key = keys[codexBossSel];
  var d = BOSSES[key];
  var rx = px + 28 + lw + 20, rw = pw - 56 - lw - 20, ry = py + 104;
  txt(d.name, rx, ry + 16, 18, d.color, 'left', '700');
  txt('生命 ' + d.hp + (key === 'oct' ? '+（随改装成长）' : '') + '    ·    招式 ' + d.patterns.length + ' 种', rx, ry + 38, 11, 'rgba(160,190,220,0.78)');
  txt('专属技能：' + d.sig, rx, ry + 56, 11.5, C.gold);

  ctx.strokeStyle = 'rgba(140,175,215,0.16)';

function buyUnlock(kind, key, price) {
  if (S.scrap < price) { flashMsg('零件不足'); return; }
  S.scrap -= price;
  if (kind === 'w') {
    if (S.weapons.indexOf(key) < 0) S.weapons.push(key);
    if (S.equip.w.length < 2) S.equip.w.push(key);
  } else {
    if (S.skills.indexOf(key) < 0) S.skills.push(key);
    if (S.equip.s.length < 3) S.equip.s.push(key);
  }
  persist();
  sfx('levelup');
  flashMsg('已解锁');
}

  S.store.push(S.bag.splice(i, 1)[0]);

  if (S.bag.length >= BAG_MAX) { flashMsg('背包已满'); return; }

  while (S.bag.length && S.store.length < STORE_MAX) S.store.push(S.bag.shift());
  persist(); sfx('pick');
}
function takeAll() {
  while (S.store.length && S.bag.length < BAG_MAX) S.bag.push(S.store.shift());
  persist(); sfx('pick');
}

      slotBox(x + 28 + (idx % 4) * (sw + gx), y + 102 + Math.floor(idx / 4) * (sh + gy), S.bag[idx], '空',
        function () { moveToStore(idx); });
    })(i);
  }

  var sx0 = x + 330;
  txt('仓 库（长期存放）', sx0, y + 86, 11, C.gold, 'left', '600');
  for (var j = 0; j < STORE_MAX; j++) {
    (function (idx) {
      slotBox(sx0 + (idx % 6) * (sw + gx), y + 102 + Math.floor(idx / 6) * (sh + gy), S.store[idx], '',
        function () { moveToBag(idx); });
    })(j);
  }

  button(x + 28, y + h - 52, 150, 36, '全部存入', '', { color: C.gold, fn: storeAll });
  button(x + 190, y + h - 52, 150, 36, '全部取出', '', { color: C.cyan, fn: takeAll });
}

/* ---------- 改装台 ---------- */
function upgradeMod(key, price) {
  var lm = weaponMods(modSel);
  var max = MOD_MAX[key] || 5;
  if (lm[key] >= max) { flashMsg('已满级'); sfx('ui'); return; }
  if (S.scrap < price) { flashMsg('零件不足'); sfx('ui'); return; }
  S.scrap -= price;
  lm[key]++;
  persist();
  sfx('levelup');
  flashMsg('改装完成');
}

function drawModPanel(x, y, w, h) {
  txt('改装台', x + 28, y + 34, 18, '#eaf6ff', 'left', '700');
  txt('零件 ' + S.scrap, x + w - 28, y + 34, 14, C.gold, 'right', '600');
  txt('改装永久生效，所有关卡通用', x + 28, y + 56, 11, 'rgba(140,175,210,0.5)');

  var keys = Object.keys(WEAPONS);
  var cw3 = (w - 56 - 20) / 3;
  for (var i = 0; i < keys.length; i++) {
    (function (k, idx) {
      var wp = WEAPONS[k];
      var mm = weaponMods(k);
      var tags = [];
      if (mm.dmg) tags.push('伤+' + (mm.dmg * 15) + '%');
      if (mm.cd) tags.push('冷-' + (mm.cd * 8) + '%');
      if (mm.extra) tags.push('特×' + mm.extra);
      var bx = x + 28 + (idx % 3) * (cw3 + 10);
      var by = y + 76 + Math.floor(idx / 3) * 54;
      button(bx, by, cw3, 46, (modSel === k ? '▶ ' : '') + wp.name, tags.length ? tags.join(' · ') : '未改装', {
        color: wp.color, fn: function () { modSel = k; sfx('ui'); }
      });
    })(keys[i], i);
  }

  var lm = weaponMods(modSel);
  var wx = WEAPONS[modSel];
  var ry = y + 76 + 2 * 54 + 16;
  txt('改装：' + wx.name, x + 28, ry, 13, wx.color, 'left', '600');

  var rows = [
    { key: 'dmg', name: '伤害强化', max: MOD_MAX.dmg, unit: 100, step: 60, per: 15, sign: '+' },
    { key: 'cd', name: '冷却精简', max: MOD_MAX.cd, unit: 90, step: 50, per: 8, sign: '-' },
    { key: 'extra', name: '专属改装', max: MOD_MAX.extra, unit: 400, step: 250 }
  ];
  var by2 = ry + 20;
  for (var r = 0; r < rows.length; r++) {
    (function (row) {
      var lv = lm[row.key];
      var full = lv >= row.max;
      var price = row.unit + lv * row.step;
      var total = lv * (row.per || 0);
      ctx.save();
      ctx.strokeStyle = full ? 'rgba(140,175,215,0.12)' : 'rgba(140,175,215,0.22)';
      ctx.lineWidth = 1;
      rrect(x + 28, by2, w - 56, 50, 5); ctx.stroke();
      ctx.restore();
      txt(row.name + '   ' + lv + ' / ' + row.max, x + 44, by2 + 18, 13, full ? C.teal : '#eaf6ff', 'left', '600');
      var desc = row.key === 'extra'
        ? (wx.type === 'melee'
            ? '每级：+12% 攻击角   ·   当前 +' + total + '%'
            : '每级：+1 弹丸   ·   当前 ' + ((wx.count || 1) + lv) + ' 弹')
        : '每级 ' + row.sign + row.per + '% ' + (row.key === 'dmg' ? '伤害' : '冷却') + '   ·   当前 ' + row.sign + total + '%';
      txt(desc, x + 44, by2 + 36, 10.5, 'rgba(140,175,210,0.6)');
      var pipGap = Math.min(20, 190 / row.max);
      var pipW = Math.max(4, Math.min(15, pipGap - 4));
      var pipStart = x + w - 262 - pipGap * row.max;
      for (var d = 0; d < row.max; d++) {
        ctx.save();
        ctx.fillStyle = d < lv ? (full ? C.teal : C.gold) : 'rgba(140,175,215,0.16)';
        ctx.fillRect(pipStart + d * pipGap, by2 + 22, pipW, 8);
        ctx.restore();
      }
      button(x + w - 250, by2 + 8, 190, 34, full ? '已满级' : '升级  ' + price + ' 零件', '', {
        color: full ? 'rgba(120,150,185,0.45)' : C.gold, disabled: full,
        fn: function () { upgradeMod(row.key, price); }
      });
      by2 += 58;
    })(rows[r]);
  }
  txt('提示：改装等级记录在存档中，死亡不会丢失', x + 28, y + h - 96, 10.5, 'rgba(130,165,200,0.5)');

  // 当前改装总览
  var sumY = by2 + 6;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,200,87,0.22)';
  ctx.lineWidth = 1;
  rrect(x + 28, sumY, w - 56, 52, 5); ctx.stroke();
  ctx.restore();
  txt('总览', x + 44, sumY + 19, 11, 'rgba(255,200,87,0.8)', 'left', '600');
  var sumLine = '伤害 ×' + (1 + 0.15 * lm.dmg).toFixed(2) +
    '    ·    冷却 ×' + Math.max(0.3, 1 - 0.08 * lm.cd).toFixed(2) +
    '    ·    ' + (wx.type === 'melee'
      ? '攻击角 +' + (12 * lm.extra) + '%'
      : '弹丸 ' + ((wx.count || 1) + lm.extra) + ' 发');
  txt(sumLine, x + 44, sumY + 39, 12.5, 'rgba(220,235,250,0.85)', 'left', '600');
}

  txt('武器最多 2 件（Tab 切换） · 技能最多 3 个（R / F / C）', x + w - 28, y + 34, 12, 'rgba(150,180,210,0.75)', 'right');

  txt('关卡内：Tab 切换武器 · R/F/C 释放技能 · 1-9 或点击使用道具', x + 28, y + h - 70, 12, 'rgba(140,175,210,0.6)');
}

function drawShopPanel(x, y, w, h) {
  txt('补给机', x + 28, y + 34, 18, '#eaf6ff', 'left', '700');
  txt('零件 ' + S.scrap, x + w - 28, y + 34, 15, C.gold, 'right', '600');

      color: C.teal, disabled: full, right: full ? '已满' : up.price, rightColor: C.gold,
      fn: (function (uu) { return function () { buyUpg(uu); }; })(up)
    });

  txt('背包 ' + S.bag.length + ' / ' + BAG_MAX + '   ·   死亡会丢失本局新获得的物品', x + 28, y + h - 100, 12, 'rgba(140,175,210,0.6)');
  button(x + 28, y + h - 76, 150, 34, '清空背包', '', { color: C.red, fn: function () { S.bag = []; persist(); } });
}

/* =========================================================
   主循环
   ========================================================= */
var last = performance.now();
function frame(now) {
  var dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  // 帧耗时监测：持续掉帧时自动降特效（低配机器也不会卡住）
  perfAvg += (Math.min(dt, 0.05) * 1000 - perfAvg) * 0.06;
  perfLow = perfAvg > 23;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

resize();
goLoad('正在唤醒「余烬」', '提示：点击任意处开始', 1.1, function () {
  scene = 'title';
  playBgm('menu', true);
});
requestAnimationFrame(frame);
